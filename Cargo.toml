[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
publish = false

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

# The CPU loop is unusably slow without optimisation, so tests build it optimised too.
[profile.dev]
opt-level = 2
