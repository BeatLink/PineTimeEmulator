[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinetime-emulator"
version = "0.1.0"
description = "A desktop window onto the PineTime emulator"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["pysdl2"]

[project.scripts]
pinetime-emulator = "pinetime_emulator.main:main"

[tool.setuptools]
packages = ["pinetime_emulator"]
