# Builds the Flatpak bundle for x86_64 and aarch64, and attaches both to the release when a version tag is pushed.
name: Flatpak

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo flatpak-build flatpak/io.github.beatlink.PineTimeEmulator.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "PineTime_Emulator-$(uname -m).flatpak" io.github.beatlink.PineTimeEmulator
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.runner }}
          path: "*.flatpak"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" *.flatpak --clobber
