# Builds the AppImage for x86_64 and aarch64, and attaches both to the release when a version tag is pushed.
name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: |
          nix build .#appimage -L
          cp result/*.AppImage .
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.runner }}
          path: "*.AppImage"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" *.AppImage --clobber
